<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiND-Shot · Strategy Validation</title>
  <meta name="description" content="Backtest validation report for the MiND-Shot mean-reversion strategy playbook." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: oklch(0.16 0.012 285); --surface-1: oklch(0.195 0.014 285); --surface-2: oklch(0.225 0.016 285);
      --border: oklch(1 0 0 / 0.09); --border-strong: oklch(1 0 0 / 0.16);
      --text: oklch(0.95 0.005 285); --text-muted: oklch(0.70 0.012 285); --text-faint: oklch(0.58 0.012 285);
      --brand: oklch(0.66 0.19 292); --brand-bright: oklch(0.74 0.17 292); --brand-dim: oklch(0.66 0.19 292 / 0.14);
      --gold: oklch(0.82 0.13 85); --gold-dim: oklch(0.82 0.13 85 / 0.14);
      --pos: oklch(0.74 0.15 155); --pos-dim: oklch(0.74 0.15 155 / 0.15);
      --neg: oklch(0.68 0.19 25); --neg-dim: oklch(0.68 0.19 25 / 0.15);
      --amber: oklch(0.80 0.15 80); --flat: oklch(0.68 0.02 285);
      --track: oklch(1 0 0 / 0.07); --grid: oklch(1 0 0 / 0.08);
      --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.22);
      --r: 14px; --r-sm: 10px;
      --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    :root[data-theme="light"]{
      --bg: oklch(0.975 0.004 285); --surface-1: oklch(1 0 0); --surface-2: oklch(0.985 0.004 285);
      --border: oklch(0 0 0 / 0.09); --border-strong: oklch(0 0 0 / 0.16);
      --text: oklch(0.22 0.01 285); --text-muted: oklch(0.44 0.012 285); --text-faint: oklch(0.55 0.012 285);
      --brand: oklch(0.52 0.20 292); --brand-bright: oklch(0.46 0.21 292); --brand-dim: oklch(0.52 0.20 292 / 0.10);
      --gold: oklch(0.62 0.13 78); --gold-dim: oklch(0.62 0.13 78 / 0.12);
      --pos: oklch(0.55 0.15 155); --pos-dim: oklch(0.55 0.15 155 / 0.12);
      --neg: oklch(0.55 0.20 27); --neg-dim: oklch(0.55 0.20 27 / 0.12);
      --amber: oklch(0.66 0.15 72); --flat: oklch(0.55 0.02 285);
      --track: oklch(0 0 0 / 0.06); --grid: oklch(0 0 0 / 0.08);
      --shadow: 0 1px 2px oklch(0 0 0 / 0.06), 0 10px 26px oklch(0 0 0 / 0.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background:var(--bg); color:var(--text); font-family:var(--sans);
      font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
      background-image:radial-gradient(120% 80% at 88% -8%, var(--brand-dim), transparent 60%),
                       radial-gradient(90% 60% at -6% 4%, var(--gold-dim), transparent 55%);
      background-attachment:fixed;
    }
    .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
    .wrap{max-width:1180px; margin:0 auto; padding:clamp(20px,4vw,44px) clamp(16px,4vw,32px) 64px}

    /* ── header ── */
    .top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}
    .brand{display:flex; align-items:center; gap:12px}
    .mark{width:38px; height:38px; border-radius:11px; flex:none;
      background:conic-gradient(from 210deg, var(--brand), var(--brand-bright), var(--gold), var(--brand));
      box-shadow:0 0 0 1px var(--border-strong), 0 0 22px var(--brand-dim); position:relative}
    .mark::after{content:"🎯"; position:absolute; inset:0; display:grid; place-items:center; font-size:18px; filter:grayscale(.2)}
    h1{font-size:clamp(1.25rem,2.4vw,1.6rem); font-weight:700; letter-spacing:-.02em; margin:0; line-height:1.1}
    .sub{color:var(--text-muted); font-size:.82rem; margin-top:2px}
    .toggle{appearance:none; cursor:pointer; font:inherit; color:var(--text-muted); background:var(--surface-1);
      border:1px solid var(--border); border-radius:999px; padding:9px 14px; min-height:44px; display:inline-flex;
      align-items:center; gap:8px; transition:color .15s, border-color .15s, background .15s}
    .toggle:hover{color:var(--text); border-color:var(--border-strong)}
    .toggle:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

    .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
    .chip{font-size:.74rem; color:var(--text-muted); background:var(--surface-1); border:1px solid var(--border);
      border-radius:8px; padding:5px 10px; display:inline-flex; gap:6px; align-items:center}
    .chip b{color:var(--text); font-weight:600}
    .chip .dot{width:6px; height:6px; border-radius:50%; background:var(--brand)}

    /* ── summary insight ── */
    .insight{margin:22px 0 4px; padding:14px 18px; background:var(--surface-1); border:1px solid var(--border);
      border-left:3px solid var(--brand); border-radius:var(--r-sm); font-size:.95rem; color:var(--text)}
    .insight b{color:var(--brand-bright); font-weight:600}
    .insight .src{color:var(--text-faint); font-size:.76rem; margin-top:4px}

    /* ── kpi strip ── */
    .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(198px,1fr)); gap:14px; margin-top:22px}
    .kpi{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r); padding:18px 18px 16px;
      box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; min-height:118px; position:relative; overflow:hidden}
    .kpi.hero{border-color:var(--brand-dim); background:linear-gradient(180deg, var(--brand-dim), transparent 60%), var(--surface-1)}
    .kpi.hero::before{content:""; position:absolute; right:-30px; top:-40px; width:120px; height:120px; border-radius:50%;
      background:radial-gradient(circle, var(--brand-dim), transparent 70%)}
    .kpi .label{font-size:.74rem; font-weight:500; color:var(--text-muted); letter-spacing:.01em; text-transform:uppercase}
    .kpi .val{font-size:clamp(1.7rem,3.2vw,2.1rem); font-weight:700; letter-spacing:-.02em; line-height:1}
    .kpi .val.glow{text-shadow:0 0 22px var(--brand-dim)}
    .kpi .cap{font-size:.76rem; color:var(--text-faint); margin-top:auto}
    .delta{display:inline-flex; align-items:center; gap:4px; font-size:.78rem; font-weight:600; padding:2px 7px;
      border-radius:6px; width:fit-content}
    .delta.pos{color:var(--pos); background:var(--pos-dim)} .delta.neg{color:var(--neg); background:var(--neg-dim)}
    .delta.flat{color:var(--flat); background:var(--track)} .delta.gold{color:var(--gold); background:var(--gold-dim)}

    /* ── section + bento ── */
    .sec-h{display:flex; align-items:baseline; gap:12px; margin:38px 0 14px}
    .sec-h h2{font-size:1.02rem; font-weight:600; letter-spacing:-.01em; margin:0}
    .sec-h .meta{font-size:.76rem; color:var(--text-faint)}
    .sec-h .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent)}
    .bento{display:grid; grid-template-columns:repeat(12,1fr); gap:14px}
    .card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r); padding:18px 20px;
      box-shadow:var(--shadow)}
    .card h3{font-size:.88rem; font-weight:600; margin:0 0 2px}
    .card .ch-sub{font-size:.74rem; color:var(--text-faint); margin-bottom:14px}
    .span7{grid-column:span 7} .span5{grid-column:span 5} .span12{grid-column:span 12}
    @media(max-width:820px){ .span7,.span5,.span12{grid-column:span 12} }

    /* ── charts ── */
    .row{display:grid; grid-template-columns:118px 1fr; gap:12px; align-items:center; margin:11px 0}
    .row .name{font-size:.8rem; color:var(--text-muted); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .bar-track{position:relative; height:26px; background:var(--track); border-radius:7px; overflow:hidden}
    .bar-fill{position:absolute; inset:0 auto 0 0; border-radius:7px;
      background:linear-gradient(90deg, var(--brand), var(--brand-bright)); transition:width .6s cubic-bezier(.32,.72,0,1)}
    .bar-fill.gold{background:linear-gradient(90deg, oklch(0.62 0.13 78), var(--gold))}
    .bar-val{position:absolute; top:0; height:26px; display:flex; align-items:center; font-size:.76rem; font-weight:600;
      color:var(--text); padding:0 8px; text-shadow:0 1px 2px oklch(0 0 0 / .4)}
    .gate{position:absolute; top:-4px; bottom:-4px; width:0; border-left:1.5px dashed var(--gold); opacity:.8}
    .gate-lbl{font-size:.68rem; color:var(--gold); margin-left:6px}

    /* dumbbell */
    .db{display:grid; grid-template-columns:118px 1fr 54px; gap:12px; align-items:center; margin:13px 0}
    .db .name{font-size:.8rem; color:var(--text-muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .db-track{position:relative; height:16px}
    .db-line{position:absolute; top:50%; height:2px; transform:translateY(-50%); background:var(--border-strong)}
    .db-dot{position:absolute; top:50%; width:12px; height:12px; border-radius:50%; transform:translate(-50%,-50%)}
    .db-dot.exp{background:var(--surface-2); border:2px solid var(--text-faint)}
    .db-dot.act{background:var(--brand); border:2px solid var(--brand-bright); box-shadow:0 0 8px var(--brand-dim)}
    .db .d{font-size:.76rem; font-weight:600; text-align:right}
    .legend{display:flex; gap:16px; font-size:.75rem; color:var(--text-muted); margin-top:6px}
    .legend span{display:inline-flex; align-items:center; gap:6px}
    .lg-dot{width:10px;height:10px;border-radius:50%}

    /* ── table ── */
    .tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--r); background:var(--surface-1); box-shadow:var(--shadow)}
    table{border-collapse:collapse; width:100%; min-width:720px; font-size:.84rem}
    thead th{position:sticky; top:0; background:var(--surface-2); color:var(--text-muted); font-weight:600;
      text-align:left; padding:12px 14px; font-size:.74rem; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap;
      border-bottom:1px solid var(--border); user-select:none}
    thead th.num{text-align:right}
    thead th.sortable{cursor:pointer} thead th.sortable:hover{color:var(--text)}
    thead th .arw{opacity:.5; font-size:.7rem; margin-left:3px}
    tbody td{padding:12px 14px; border-bottom:1px solid var(--border)}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:var(--track)}
    td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
    .st-name{font-weight:600; color:var(--text)}
    .coin{font-family:var(--mono); font-size:.76rem; color:var(--text-muted); background:var(--track); padding:2px 7px; border-radius:6px}
    .badge{display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:600; padding:3px 9px; border-radius:999px}
    .badge.ok{color:var(--pos); background:var(--pos-dim)} .badge.no{color:var(--neg); background:var(--neg-dim)}

    /* ── states ── */
    .sk{background:linear-gradient(90deg,var(--track),oklch(1 0 0 / .12),var(--track)); background-size:200% 100%;
      animation:sh 1.3s linear infinite; border-radius:8px}
    @keyframes sh{to{background-position:-200% 0}}
    .err{margin-top:40px; padding:28px; text-align:center; background:var(--surface-1); border:1px solid var(--neg-dim); border-radius:var(--r)}
    .err b{color:var(--neg)}
    .foot{margin-top:44px; padding-top:20px; border-top:1px solid var(--border); color:var(--text-faint); font-size:.78rem; line-height:1.6}
    .foot b{color:var(--text-muted)}
    @media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
    { "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "htm": "https://esm.sh/htm@3.1.1"
    } }
  </script>
  <script type="module">
    import React, { useState, useEffect, useMemo } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";
    const html = htm.bind(React.createElement);

    const n1 = (x) => (x == null ? "—" : x.toFixed(1));
    const signed = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1);
    const money = (x) => "$" + x.toFixed(2);

    function Delta({ kind, glyph, children }) {
      return html`<span class=${"delta " + kind}>${glyph ? glyph + " " : ""}${children}</span>`;
    }

    function Kpi({ label, value, glow, delta, cap, hero }) {
      return html`
        <div class=${"kpi" + (hero ? " hero" : "")}>
          <div class="label">${label}</div>
          <div class=${"val mono" + (glow ? " glow" : "")}>${value}</div>
          ${delta || null}
          <div class="cap">${cap}</div>
        </div>`;
    }

    function BarRow({ name, pct, max, label, gold, gate }) {
      const w = Math.max(0, Math.min(100, (pct / max) * 100));
      const inside = w > 22;
      return html`
        <div class="row">
          <div class="name" title=${name}>${name}</div>
          <div class="bar-track">
            <div class=${"bar-fill" + (gold ? " gold" : "")} style=${{ width: w + "%" }}></div>
            ${gate != null ? html`<div class="gate" style=${{ left: (gate / max) * 100 + "%" }}></div>` : null}
            <div class="bar-val" style=${inside ? { right: 100 - w + "%" } : { left: w + "%" }}>${label}</div>
          </div>
        </div>`;
    }

    function Dumbbell({ rows, lo, hi }) {
      const pos = (v) => ((v - lo) / (hi - lo)) * 100;
      return html`
        <div>
          ${rows.map((r) => {
            const a = pos(r.win_rate), e = pos(r.expected_win_rate);
            const d = r.win_rate - r.expected_win_rate;
            return html`
              <div class="db" key=${r.strategy_id}>
                <div class="name" title=${r.name}>${r.name}</div>
                <div class="db-track">
                  <div class="db-line" style=${{ left: Math.min(a, e) + "%", width: Math.abs(a - e) + "%" }}></div>
                  <div class="db-dot exp" style=${{ left: e + "%" }} title=${"expected " + n1(r.expected_win_rate) + "%"}></div>
                  <div class="db-dot act" style=${{ left: a + "%" }} title=${"actual " + n1(r.win_rate) + "%"}></div>
                </div>
                <div class="d mono" style=${{ color: Math.abs(d) <= 6 ? "var(--pos)" : "var(--amber)" }}>
                  ${(Math.abs(d) <= 6 ? "✓ " : "") + signed(d)}
                </div>
              </div>`;
          })}
          <div class="legend">
            <span><i class="lg-dot" style=${{ background: "var(--surface-2)", border: "2px solid var(--text-faint)" }}></i>Playbook expected</span>
            <span><i class="lg-dot" style=${{ background: "var(--brand)", border: "2px solid var(--brand-bright)" }}></i>Backtest actual</span>
          </div>
        </div>`;
    }

    const COLS = [
      { k: "name", t: "Strategy", num: false },
      { k: "asset", t: "Coin", num: false },
      { k: "win_rate", t: "Win %", num: true },
      { k: "expected_win_rate", t: "Exp %", num: true },
      { k: "delta", t: "Δ", num: true },
      { k: "trades", t: "Trades", num: true },
      { k: "ls", t: "L / S", num: true },
      { k: "final_wallet", t: "Final $", num: true },
      { k: "return_pct", t: "Return %", num: true },
      { k: "max_drawdown_pct", t: "Max DD %", num: true },
      { k: "passes", t: "Verdict", num: false },
    ];

    function Table({ rows }) {
      const [sort, setSort] = useState({ k: "win_rate", dir: -1 });
      const data = useMemo(() => {
        const val = (r, k) => k === "delta" ? r.win_rate - r.expected_win_rate : k === "ls" ? r.long_trades : r[k];
        return [...rows].sort((a, b) => {
          const x = val(a, sort.k), y = val(b, sort.k);
          if (typeof x === "string") return x.localeCompare(y) * sort.dir;
          return (x - y) * sort.dir;
        });
      }, [rows, sort]);
      const click = (k) => setSort((s) => ({ k, dir: s.k === k ? -s.dir : -1 }));
      return html`
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              ${COLS.map((c) => html`
                <th key=${c.k} class=${(c.num ? "num " : "") + "sortable"}
                    aria-sort=${sort.k === c.k ? (sort.dir === 1 ? "ascending" : "descending") : "none"}
                    onClick=${() => click(c.k)}>
                  ${c.t}${sort.k === c.k ? html`<span class="arw">${sort.dir === 1 ? "▲" : "▼"}</span>` : ""}
                </th>`)}
            </tr></thead>
            <tbody>
              ${data.map((r) => {
                const d = r.win_rate - r.expected_win_rate;
                return html`
                  <tr key=${r.strategy_id}>
                    <td class="st-name">${r.name}</td>
                    <td><span class="coin">${r.asset}</span></td>
                    <td class="num" style=${{ color: "var(--brand-bright)", fontWeight: 600 }}>${n1(r.win_rate)}</td>
                    <td class="num" style=${{ color: "var(--text-muted)" }}>${n1(r.expected_win_rate)}</td>
                    <td class="num" style=${{ color: Math.abs(d) <= 6 ? "var(--pos)" : "var(--amber)" }}>${signed(d)}</td>
                    <td class="num">${r.trades}</td>
                    <td class="num" style=${{ color: "var(--text-muted)" }}>${r.long_trades} / ${r.short_trades}</td>
                    <td class="num">${money(r.final_wallet)}</td>
                    <td class="num" style=${{ color: r.return_pct >= 0 ? "var(--pos)" : "var(--neg)" }}>${signed(r.return_pct)}</td>
                    <td class="num" style=${{ color: "var(--amber)" }}>${n1(r.max_drawdown_pct)}</td>
                    <td>${r.passes
                      ? html`<span class="badge ok">✓ Validated</span>`
                      : html`<span class="badge no">✗ Failed</span>`}</td>
                  </tr>`;
              })}
            </tbody>
          </table>
        </div>`;
    }

    function Skeleton() {
      return html`
        <div>
          <div class="kpis">
            ${[0,1,2,3,4].map((i) => html`<div class="kpi" key=${i}><div class="sk" style=${{height:"12px",width:"50%"}}></div>
              <div class="sk" style=${{height:"30px",width:"70%",marginTop:"8px"}}></div>
              <div class="sk" style=${{height:"10px",width:"85%",marginTop:"auto"}}></div></div>`)}
          </div>
          <div class="bento" style=${{marginTop:"38px"}}>
            <div class="card span7"><div class="sk" style=${{height:"220px"}}></div></div>
            <div class="card span5"><div class="sk" style=${{height:"220px"}}></div></div>
          </div>
        </div>`;
    }

    function Toggle({ theme, onToggle }) {
      return html`<button class="toggle" onClick=${onToggle} aria-label="Toggle color theme">
        ${theme === "dark" ? "☀︎ Light" : "☾ Dark"}</button>`;
    }

    function App() {
      const [state, setState] = useState({ status: "loading" });
      const [theme, setTheme] = useState(() =>
        localStorage.getItem("ms-theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("ms-theme", theme);
      }, [theme]);

      useEffect(() => {
        fetch("./backtest.json", { cache: "no-cache" })
          .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then((d) => setState({ status: "ok", data: d }))
          .catch((e) => setState({ status: "error", err: String(e) }));
      }, []);

      const toggle = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

      const header = html`
        <div class="top">
          <div class="brand">
            <div class="mark"></div>
            <div>
              <h1>MiND-Shot · Strategy Validation</h1>
              <div class="sub">Backtest report — mean-reversion playbook</div>
            </div>
          </div>
          <${Toggle} theme=${theme} onToggle=${toggle} />
        </div>`;

      if (state.status === "loading")
        return html`<div class="wrap">${header}<div style=${{marginTop:"22px"}}><${Skeleton}/></div></div>`;

      if (state.status === "error")
        return html`<div class="wrap">${header}
          <div class="err"><b>Couldn't load the report.</b><div style=${{color:"var(--text-muted)",marginTop:"8px"}}>
          Expected <span class="mono">backtest.json</span> next to this page. (${state.err})</div></div></div>`;

      const { config: cfg, summary: s, results, generated_at } = state.data;
      const maxRet = Math.max(...results.map((r) => r.return_pct), 1);
      const byWin = [...results].sort((a, b) => b.win_rate - a.win_rate);
      const byRet = [...results].sort((a, b) => b.return_pct - a.return_pct);
      const winGateDelta = +(s.avg_win_rate - 60).toFixed(1);
      const avgFinal = cfg.account_usd * (1 + s.avg_return_pct / 100);
      const when = new Date(generated_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

      return html`
        <div class="wrap">
          ${header}

          <div class="chips">
            <div class="chip"><span class="dot"></span>Account <b>${money(cfg.account_usd).replace(".00","")}</b></div>
            <div class="chip">Leverage <b>${cfg.leverage}×</b></div>
            <div class="chip">Allocation <b>${cfg.alloc_pct}%</b></div>
            <div class="chip">Margin <b>${cfg.margin}</b></div>
            <div class="chip">Round-trip cost <b>${cfg.round_trip_pct}%</b></div>
            <div class="chip">${cfg.window}</div>
          </div>

          <div class="insight">
            <b>${s.passing} of ${s.strategies} strategies validated.</b> The playbook holds up out-of-sample:
            <b>${n1(s.avg_win_rate)}% </b> average win rate across <b>${s.total_trades}</b> trades, averaging
            <b>${signed(s.avg_return_pct)}%</b> return per strategy.
            <div class="src">Computed from ${s.total_trades} simulated round-trips over the committed 4h fixtures · generated ${when}</div>
          </div>

          <div class="kpis">
            <${Kpi} hero=true label="Validated" value=${s.passing + " / " + s.strategies} glow=true
              delta=${html`<${Delta} kind="pos" glyph="✓">all pass<//>`}
              cap="≥40 trades · >60% win · profitable" />
            <${Kpi} label="Avg win rate" value=${n1(s.avg_win_rate) + "%"}
              delta=${html`<${Delta} kind="pos" glyph="▲">${signed(winGateDelta)} pts<//>`}
              cap="vs 60% pass gate" />
            <${Kpi} label="Total trades" value=${s.total_trades}
              delta=${html`<${Delta} kind="flat">5 strategies<//>`}
              cap="6-month window · 4h close" />
            <${Kpi} label="Avg return" value=${signed(s.avg_return_pct) + "%"}
              delta=${html`<${Delta} kind="gold" glyph="▲">best ${signed(s.best_return_pct)}%<//>`}
              cap=${money(cfg.account_usd).replace(".00","") + " → ~" + money(avgFinal).replace(".00","") + " avg"} />
            <${Kpi} label="Worst drawdown" value=${n1(s.worst_drawdown_pct) + "%"}
              delta=${html`<${Delta} kind="neg" glyph="▼">deepest<//>`}
              cap="peak-to-trough, single strategy" />
          </div>

          <div class="sec-h"><h2>Performance</h2><span class="meta">sorted best-first</span><div class="rule"></div></div>
          <div class="bento">
            <div class="card span7">
              <h3>Win rate by strategy</h3>
              <div class="ch-sub">Gold line marks the 60% validation gate — every strategy clears it.</div>
              ${byWin.map((r) => html`<${BarRow} key=${r.strategy_id} name=${r.name} pct=${r.win_rate} max=${100}
                label=${n1(r.win_rate) + "%"} gate=${60} />`)}
              <div style=${{textAlign:"right",marginTop:"2px"}}><span class="gate-lbl">▏ 60% gate</span></div>
            </div>
            <div class="card span5">
              <h3>Return on $${cfg.account_usd.toFixed(0)}</h3>
              <div class="ch-sub">Net of ${cfg.round_trip_pct}% round-trip cost, ${cfg.leverage}× on ${cfg.alloc_pct}% allocation.</div>
              ${byRet.map((r) => html`<${BarRow} key=${r.strategy_id} name=${r.name} pct=${r.return_pct} max=${maxRet}
                label=${signed(r.return_pct) + "%"} gold=true />`)}
            </div>
            <div class="card span12">
              <h3>Backtest vs playbook expectation</h3>
              <div class="ch-sub">How tightly the out-of-sample win rate tracks the published playbook — ✓ = within the 6-point tolerance band.</div>
              <${Dumbbell} rows=${results} lo=${55} hi=${85} />
            </div>
          </div>

          <div class="sec-h"><h2>Every strategy</h2><span class="meta">click a header to sort</span><div class="rule"></div></div>
          <${Table} rows=${results} />

          <div class="foot">
            <b>Methodology.</b> Each strategy is replayed over the committed price fixtures with
            ${money(cfg.account_usd).replace(".00","")} capital, ${cfg.leverage}× leverage, ${cfg.alloc_pct}% allocation,
            ${cfg.margin} margin and a ${cfg.round_trip_pct}% round-trip cost. A strategy is “validated” only if it takes
            ≥40 trades, wins >60%, ends profitable, and lands within 6 points of its playbook expectation.<br/>
            <b>Not financial advice.</b> Past backtested performance is educational and does not guarantee future results.
            Data regenerated by <span class="mono">docs/gen_report.py</span> · last run ${when}.
          </div>
        </div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
